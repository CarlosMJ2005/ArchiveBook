<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <title>Archivebook login</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f0e6;
            font-family: serif;
        }

        .login-card {
            background-color: #fce8cc;
            border: none;
            border-radius: 1rem;
            font-family: serif;
        }

        .signin-card {
            background-color: #fff3e2;
            border: none;
            border-radius: 1rem;
            font-family: serif;
        }

        .btn-beige {
            background-color: #c9a97c;
            color: #5c483a;
            font-weight: 600;
            font-family: serif;
        }

        .btn-beige:hover {
            background-color: #84240c;
            color: #f8d5a5;
            transition: 0.2s ease;
            font-family: serif;
        }

        .visibilityButton{
            background-color: #f5f0e6;
            border: #ff0000;
            border-radius: 2;
            color: #5c483a;
            font-weight: 600;
            font-family: serif;
        }

        .visibilityButton:hover {
            background-color: #c9a97c;
            color: #5c483a;
            transition: 0.2s ease;
            font-family: serif;
        }

        .form-control {
            background-color: #F5F0E6;
            border-color: #CBB89D;
            font-family: serif;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #A8926E;
            font-family: serif;
        }

        .text-beige {
            color: #4e250a;
            font-family: serif;
        }

        #log-to-sign:hover, #sign-to-log:hover {
            background-color: #84240c;
            color: #fce8cc;
            padding: 4px 8px;
            border-radius: 8px;
            transition: 0.2s ease;
            font-family: serif;
        }
        .errorLabel{
            color: red;
            font-family: serif;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card login-card p-4 shadow" id="log" style="width: 22rem;">
        <div class="card-body">

            <h3 class="text-center text-beige mb-4">Log in</h3>

            <form id="formLog">
                <div class="mb-3">
                    <label class="form-label text-beige">Email</label>
                    <input type="email" class="form-control" id="email-log" placeholder="example@email.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-beige">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password-log" placeholder="••••••••" required>
                        <img src="./images/closed_eye.png" style="width: 50px;" id="toggle-password-log" class="btn border border-secondary visibilityButton">
                    </div>
                </div>
                <div class="mb-3">
                    <p>
                        <input type="checkbox" id="state"> Remember Me
                    </p>
                </div>
                <label id="error-label-login" class="d-none errorLabel"></label>
                <div class="d-grid mb-3">
                    <button id="login" type="button" class="btn btn-beige">
                        Log in
                    </button>
                </div>
            </form>
            
            

            <p class="text-center text-beige mb-0">
                Don't you have an account yet?
            </br>
                <a href="#" class="fw-semibold text-beige text-center" id="log-to-sign">
                    Sign in
                </a>
            </p>
        </div>
    </div>
    <div class="card signin-card p-4 shadow d-none" id="sign" style="width: 24rem;">
        <div class="card-body">

            <h3 class="text-center text-beige mb-4">Sign in</h3>

            <form id="formSign">
                <div class="mb-3">
                    <label class="form-label text-beige">Email</label>
                    <input type="email" class="form-control" id="email-sign" placeholder="example@email.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-beige">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password-sign" placeholder="••••••••" required>
                        <img src="./images/closed_eye.png" style="width: 50px;" id="toggle-password-sign" class="btn border border-secondary visibilityButton">
                    </div>
                    
                </div>

                <div class="mb-3">
                    <label class="form-label text-beige">Confirm password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="confirmation-sign" placeholder="••••••••" required>
                        <img src="./images/closed_eye.png" style="width: 50px;" id="toggle-confirmation-sign" class="btn border border-secondary visibilityButton">
                    </div>
                    
                </div>

                </br>
                <label id="error-label-signin" class="d-none errorLabel"></label>

                <div class="d-grid mb-3">
                    <button id="signin" type="button" class="btn btn-beige">
                        Sign in
                    </button>
                </div>
            </form>
        <div>
            <p class="text-center text-beige mb-0">
                Do you already have an account?
                </br>
                <a href="#" class="fw-semibold text-beige mb-3" id="sign-to-log">
                    Log in
                </a>
            </p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./main.js"></script>
</body>

</html>
