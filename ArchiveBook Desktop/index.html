<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <title>Proyecto</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #F5F0E6;
        }

        .login-card {
            background-color: #fce8cc;
            border: none;
            border-radius: 1rem;
        }

        .signin-card{
            background-color: #fff3e2;
            border: none;
            border-radius: 1rem;
        }

        .btn-beige {
            background-color: #c9a97c;
            color: #5c483a;
            font-weight: 600;
        }

        .btn-beige:hover {
            background-color: #a85521;
            color: #f8d5a5;
        }

        .form-control {
            background-color: #F5F0E6;
            border-color: #CBB89D;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #A8926E;
        }

        .text-beige {
            color: #4e250a;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card login-card p-4 shadow" id="log" style="width: 22rem;">
        <div class="card-body">

            <h3 class="text-center text-beige mb-4">Log in</h3>

            <form>
                <div class="mb-3">
                    <label class="form-label text-beige">Email</label>
                    <input type="email" class="form-control" placeholder="example@email.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-beige">Password</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-beige">
                        Log in
                    </button>
                </div>
            </form>

            <p class="text-center text-beige mb-0">
                Don't you have an account already?
                <a href="#" onclick="visibilidad(event, true)" class=" fw-semibold text-beige text-decoration-none">
                    Sign in
                </a>
            </p>
        </div>
    </div>
    <div class="card signin-card p-4 shadow d-none" id="sign" style="width: 24rem;">
        <div class="card-body">

            <h3 class="text-center text-beige mb-4">Sign in</h3>

            <form>
                <div class="mb-3">
                    <label class="form-label text-beige">username</label>
                    <input type="text" class="form-control" placeholder="Your username" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-beige">Email</label>
                    <input type="email" class="form-control" placeholder="example@email.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-beige">Password</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-beige">Confirm password</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>

            </br>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-beige">
                        Sign in
                    </button>
                </div>
            </form>

            <p class="text-center text-beige mb-0">
                Do you already have an account?
                <a href="#" onclick="visibilidad(event)" class="fw-semibold text-beige text-decoration-none">
                    Log in
                </a>
            </p>

        </div>
    </div>
    <script>
        function visibilidad(event, bool = false) {
            console.log
            event.preventDefault();
            if (bool){
                document.getElementById('sign').classList.remove("d-none")
                document.getElementById('log').classList.add("d-none")
            }
            else{
                document.getElementById('log').classList.remove("d-none")
                document.getElementById('sign').classList.add("d-none")
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="main.js"></script>
</body>

</html>
