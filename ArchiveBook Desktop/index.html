<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <title>Proyecto</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    body {
      background-color: #F5F0E6;
    }

    .login-card {
      background-color: #E6D8C3;
      border: none;
      border-radius: 1rem;
    }

    .btn-beige {
      background-color: #CBB89D;
      color: #5A4A3F;
      font-weight: 600;
    }

    .btn-beige:hover {
      background-color: #B8A27E;
      color: #5A4A3F;
    }

    .form-control {
      background-color: #F5F0E6;
      border-color: #CBB89D;
    }

    .form-control:focus {
      box-shadow: none;
      border-color: #A8926E;
    }

    .text-beige {
      color: #5A4A3F;
    }
  </style>
</head>

<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="Log card login-card p-4 shadow" style="width: 22rem;">
        <div class="card-body">

            <h3 class="text-center text-beige mb-4">Log in</h3>

            <form>
                <div class="mb-3">
                    <label class="form-label text-beige">Email</label>
                    <input type="email" class="form-control" placeholder="example@email.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-beige">Password</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-beige">
                        Enter
                    </button>
                </div>
            </form>

            <p class="text-center text-beige mb-0">
                Don't you have an account already?
                <a href="#" onclick="miFuncion(event)" class=" fw-semibold text-beige text-decoration-none">
                    Sign in
                </a>
            </p>
        </div>
    </div>
    <script>
        function miFuncion(event) {
        event.preventDefault();
        
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="main.js"></script>
</body>

</html>
