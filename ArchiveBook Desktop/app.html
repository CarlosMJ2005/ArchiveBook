<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Archivebook app</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .popup {
            position: fixed;
            background-color: #fff3e2;
            border: 2px solid #84240c;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 1050;
            /* sobre navbar y contenido */
        }

        /* Pop-up pegado a la izquierda */
        .right-popup {
            top: 70px;
            /* debajo del navbar */
            right: 0;
            width: 250px;
        }

        /* Pop-up centrado */
        .center-popup {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        /* Botón de cerrar */
        .close-btn {
            position: absolute;
            top: 5px;
            right: 10px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #84240c;
        }

        body {
            background-color: #f5f0e6;
            padding-top: 60px;
        }

        #navbar {
            background-color: #fcdcaf;
        }

        .btn-beige {
            background-color: #fcdcaf;
            color: #5c483a;
            font-weight: 600;
        }

        .btn-beige:hover {
            background-color: #84240c;
            color: #f8d5a5;
            transition: 0.2s ease;
        }

        .sidebar {
            width: 275px;
            background-color: #fce8cc;
            height: 100vh;
            padding-top: 90px;
            padding-left: 20px;
            padding-right: 20px;
            position: fixed;
            left: 0;
            top: 0;
        }

        h1 {
            color: #501f09;
        }

        #detailCover {
            max-width: 293px; 
        }

        .sidebar a {
            display: block;
            color: #4e250a;
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 8px;
            font-weight: 500;
        }

        .sidebar a:hover {
            background-color: #84240c;
            color: #fce8cc;
            transition: 0.2s ease;
        }

        .main-content {
            margin-left: 260px;
            padding: 30px;
        }

        h2 {
            color: #4e250a;
        }

        li {
            padding-right: 20px;
        }

        .icon-btn {
            background: none;
            border-radius: 1rem;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .icon {
            max-height: 45px;
            align-content: center;
        }

        .minibutton {
            max-height: 30px;
        }

        #menu:hover,
        #search:hover {
            border-radius: 1rem;
            border: none;
            background-color: #fcf0e3;
        }

        section {
            background-color: #fff3e2;
            padding: 20px;
            border-radius: 1rem;
            margin-bottom: 20px;
        }

        #book{
            max-width: 150px;
        }

        #book img{
            max-width: 150px; 
        }

        #book img:hover{
            cursor: pointer;
        }


        #justified {
            justify-content:center;
        }
    </style>
</head>

<body>
    <div id="right-popup" class="popup right-popup d-none">
        <div class="d-grid mb-3">
            <button id="filterTitle" class="btn btn-beige">
                Filter by title
            </button>
        </div>
        <div class="d-grid mb-3">
            <button id="filterAuthor" class="btn btn-beige">
                Filter by author
            </button>
        </div>
        <div class="d-grid mb-3">
            <button id="filterPublisher" class="btn btn-beige">
                Filter by publisher
            </button>
        </div>
        <div class="d-grid mb-3">
            <button id="filterCategories" class="btn btn-beige">
                Filter by categories
            </button>
        </div>
    </div>

    <div id="center-popup" class="popup center-popup d-flex d-none">
        <button class="close-btn" id="close-center-popup">&times;</button>
        <img src="./images/easter.jpg" id="detailCover">
        <div>
            <h2>Title: <span id="detailTittle"></span></h2>
            <h2>Author: <span id="detailAuthor"></span></h2>
            <h2>Publisher: <span id="detailPublisher"></span></h2>
            <h2>Categories: <span id="detailCategories"></span></h2>
            <h2>Synopsis: <span id="detailSynopsis"></span></h2>
            <h2>Publication year: <span id="detailYear"></span></h2>
            <h2>ISBN: <span id="detailIsbn"></span></h2>
        </div>

    </div>
    <nav class="navbar navbar-expand-lg navbar-archive fixed-top" id="navbar">
        <div class="container-fluid">
            <h1 class="text-beige">ArchiveBook</h1>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#archiveNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="archiveNavbar">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="me-3 d-flex">
                        <label>Nombre del book:</label>
                        <input type="text" id="searcher">
                    </li>
                    <li class="me-3" style="padding-right: 300px;">
                        <button class="icon-btn">
                            <img src="./images/lupa.png" class="icon" id="search">
                        </button>
                    </li>
                    <li>
                        <button class="icon-btn" id="menuButon">
                            <img src="./images/menu.png" class="icon" id="menu">
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <aside class="sidebar">
        <nav>
            <h3 class="d-flex flex-wrap gap-1"><img src="./images/star.png" class="icon"><a
                    href="#best-sellers-list">Best sellers</a></h3>
            <p>Most pupular</p>
            <h3 class="d-flex flex-wrap gap-1"><img src="./images/heart.png" class="icon"><a
                    href="#favourites-list">Favourites</a></h3>
            <p>Your favourite books</p>
            <h3 class="d-flex flex-wrap gap-1"><img src="./images/bookmark.png" class="icon"><a
                    href="#to-read-list">Yet to read</a></h3>
            <p>Your books marked to read</p>
            <h3 class="d-flex flex-wrap gap-1"><img src="./images/notification.png" class="icon"><a
                    href="#to-return-list">To return</a></h3>
            <p>Your books to return</p>
        </nav>
    </aside>

    <main class="main-content">
        <section class="mb-4">
            <h2 class="gap-4 d-flex">
                <img src="./images/star-bold.png" class="icon">
                <p>Best sellers:</p>
            </h2>
            <div class="d-flex flex-wrap gap-4" id="best-sellers-list">
                
            </div>
        </section>

        <section class="mb-4">
            <h2 class="gap-4 d-flex">
                <img src="./images/heart-bold.png" class="icon">
                <p>Favourites:</p>
            </h2>
            <div class="d-flex flex-wrap gap-4" id="favourites-list">
                
            </div>
        </section>

        <section class="mb-4">
            <h2 class="gap-4 d-flex">
                <img src="./images/bookmark-bold.png" class="icon">
                <p>Yet to read:</p>
            </h2>
            <div class="d-flex flex-wrap gap-4" id="to-read-list">
                
            </div>
        </section>
        <section class="mb-4">
            <h2 class="gap-4 d-flex">
                <img src="./images/notification-bold.png" class="icon">
                <p>To return:</p>
            </h2>
            <div class="d-flex flex-wrap gap-4" id="to-return-list">
                
            </div>
        </section>
        <section class="mb-4">
            <h2>All:</h2>
            <div class="d-flex flex-wrap gap-4" id="all-list">
                
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./main.js"></script>
</body>

</html>
