<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <title>Archivebook app</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f0e6;
        }
        h1{
            margin-left: 30px;
            margin-top: 20px;
        }

        .login-card {
            background-color: #fce8cc;
            border: none;
            border-radius: 1rem;
        }

        .signin-card {
            background-color: #fff3e2;
            border: none;
            border-radius: 1rem;
        }

        .btn-beige {
            background-color: #c9a97c;
            color: #5c483a;
            font-weight: 600;
        }

        .btn-beige:hover {
            background-color: #84240c;
            color: #f8d5a5;
            transition: 0.2s ease;
        }

        .form-control {
            background-color: #F5F0E6;
            border-color: #CBB89D;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #A8926E;
        }

        .text-beige {
            color: #4e250a;
        }

        #change:hover {
            background-color: #84240c;
            color: #fce8cc;
            padding: 4px 8px;
            border-radius: 8px;
            transition: 0.2s ease;
        }
    </style>
</head>

<body class="d-flex justify-content-left vh-100">
    <h1 class="text-left text-beige">ArchiveBook</h1>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="mainApp.js"></script>
</body>

</html>
